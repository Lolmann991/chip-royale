<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip Royale</title>
    <base href="/chip-royale/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#0d0b10" />
    <link rel="stylesheet" href="css/game.css" />
    <style>
        html, body { margin: 0; height: 100%; background: #0d0b10; color: #f4efe2; font-family: "Segoe UI", system-ui, sans-serif; }
        *, *::before, *::after { box-sizing: border-box; }
        .boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
        .boot-suit { font-size: 4rem; color: #f5c451; animation: boot 1.2s ease-in-out infinite; }
        .boot p { color: #b9b2a2; letter-spacing: .2em; text-transform: uppercase; font-size: .8rem; }
        @keyframes boot { 50% { transform: translateY(-10px) rotate(-8deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="boot"><div><div class="boot-suit">♠</div><p>Chip Royale lädt …</p></div></div>
    </div>

    <div id="blazor-error-ui">
        Ein Fehler ist aufgetreten / An error has occurred.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Language chosen in the game (DE/EN), read by Program.cs before the app starts.
        window.chipRoyale = {
            getCulture: () => { try { return localStorage.getItem('cr-culture'); } catch { return null; } },
            setCulture: (c) => { try { localStorage.setItem('cr-culture', c); } catch { } },
            storageGet: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            storageSet: (k, v) => { try { localStorage.setItem(k, v); } catch { } },
            storageRemove: (k) => { try { localStorage.removeItem(k); } catch { } },
            // Saves text as a file (offline version: "Spielstand sichern").
            download: (name, text) => {
                const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
                const a = document.createElement("a");
                a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            },
            // Developer console: ^ (key left of 1) or F2 opens and closes it.
            devConsole: {
                ref: null,
                onKey: null,
                init(ref) {
                    this.dispose();
                    this.ref = ref;
                    this.onKey = (e) => {
                        const toggle = e.code === "Backquote" || e.key === "F2";
                        const inConsole = e.target && e.target.id === "devcon-input";
                        if (inConsole && ["Tab", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
                        if (!toggle) return;
                        const typing = !inConsole && e.target && (e.target.isContentEditable
                            || (e.target.tagName === "INPUT" && e.target.type !== "range") || e.target.tagName === "TEXTAREA");
                        if (typing && e.key !== "F2") return;
                        e.preventDefault();
                        e.stopPropagation();
                        this.ref?.invokeMethodAsync("Toggle").catch(() => { });
                    };
                    document.addEventListener("keydown", this.onKey, true);
                },
                dispose() {
                    if (this.onKey) document.removeEventListener("keydown", this.onKey, true);
                    this.onKey = null;
                    this.ref = null;
                },
                scroll() { const o = document.getElementById("devcon-out"); if (o) o.scrollTop = o.scrollHeight; },
                focus() { document.getElementById("devcon-input")?.focus(); },
            },
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Offline version: keep all files in the browser so the game also starts without internet.
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(() => { });
    </script>
</body>
</html>

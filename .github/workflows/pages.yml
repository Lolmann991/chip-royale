name: GitHub Pages (Offline-Version)

# Publishes the offline version of the game as a static site: no server, no accounts, progress in the
# browser (save files for backups). A service worker keeps the app in the browser, so after the first
# visit it also starts without internet and can be installed as an app.
# Setup: Settings → Pages → Source: "GitHub Actions"; Settings → Environments → github-pages: allow
# the branch "offline". Note: a repository has one Pages site – the last deployment wins.

on:
  push:
    branches: [offline]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish client
        run: dotnet publish src/ChipRoyale.Client/ChipRoyale.Client.csproj -c Release -o publish

      - name: Prepare static site
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          cd publish/wwwroot
          # The site lives under https://<user>.github.io/<repo>/
          sed -i "s#<base href=\"/\" />#<base href=\"/${REPO}/\" />#" index.html
          # Pre-compressed copies would still contain the old content.
          rm -f index.html.br index.html.gz
          # Deep links (e.g. /shop) are answered with 404.html → load the app there too.
          cp index.html 404.html
          # Let files starting with "_" (_framework) through.
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

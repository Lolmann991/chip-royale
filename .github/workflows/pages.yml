name: Offline-Version bauen

# Builds the offline version (no server, no accounts, progress in the browser, playable without
# internet after the first visit) and puts the finished site into the branch "offline".
# GitHub Pages serves that branch directly: Settings → Pages → Source: "Deploy from a branch" → offline / (root).
# Source code: this branch (offline-src). Every push here updates the game on GitHub Pages.

on:
  push:
    branches: [offline-src]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish client
        run: dotnet publish src/ChipRoyale.Client/ChipRoyale.Client.csproj -c Release -o publish

      - name: Prepare static site
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          cd publish/wwwroot
          # The site lives under https://<user>.github.io/<repo>/
          sed -i "s#<base href=\"/\" />#<base href=\"/${REPO}/\" />#" index.html
          # Pre-compressed copies would still contain the old content.
          rm -f index.html.br index.html.gz
          # Deep links (e.g. /shop) are answered with 404.html → load the app there too.
          cp index.html 404.html
          # Serve the files as they are (no Jekyll; keeps the "_framework" folder).
          touch .nojekyll
          printf '# Chip Royale – Offline-Version\n\nFertig gebautes Spiel für GitHub Pages (automatisch erzeugt aus dem Branch `offline-src`, bitte nicht von Hand ändern).\n' > README.md

      - name: Put the site into the branch "offline"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: offline
          publish_dir: ./publish/wwwroot
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Offline-Version aktualisiert"
